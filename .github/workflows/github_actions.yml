# Complete GitHub Actions with Hugging Face Hub + Spaces Integration

name: AQI Pipeline with Hugging Face Integration

on:
  schedule:
    - cron: '0 */1 * * *'    # Every hour for data fetching
    - cron: '0 1 * * *'      # Daily at 6 AM for training karachi timezone
    - cron: '0 */6 * * *'    # Every 6 hours for inference
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: aqi-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.9'
  HF_REPO: ${{ secrets.HF_REPO }}           # e.g., "yourusername/aqi-models"
  HF_SPACE: ${{ secrets.HF_SPACE }}         # e.g., "yourusername/aqi-dashboard"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should-fetch: ${{ steps.check.outputs.data_fetch }}
      should-train: ${{ steps.check.outputs.training }}
      should-infer: ${{ steps.check.outputs.inference }}
    steps:
      - id: check
        run: |
          event="${{ github.event_name }}"
          schedule="${{ github.event.schedule }}"
          
          if [[ "$event" == "schedule" || "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "data_fetch=true" >> $GITHUB_OUTPUT
          else
            echo "data_fetch=false" >> $GITHUB_OUTPUT
          fi
          
          if [[ ("$event" == "schedule" && "$schedule" == "0 6 * * *") || "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "training=true" >> $GITHUB_OUTPUT
          else
            echo "training=false" >> $GITHUB_OUTPUT
          fi
          
          if [[ "$event" == "schedule" || "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "inference=true" >> $GITHUB_OUTPUT
          else
            echo "inference=false" >> $GITHUB_OUTPUT
          fi

  data-fetching:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should-fetch != 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install requests pandas numpy scikit-learn xgboost joblib shap streamlit plotly huggingface_hub
      
      - name: Set Python path
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Fetch new data
        run: python data_fetching/fetch_aqi_data.py
        env:
          AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      
      - name: Compute features
        run: python feature_engineering/compute_features.py
      
      - name: Upload data and metadata to Hugging Face Hub
        run: |
          python -c "
          import os
          import glob
          from huggingface_hub import HfApi, login
          from datetime import datetime
          
          try:
            login(token='${{ secrets.HF_TOKEN }}')
            api = HfApi()
            
            repo_id = os.environ.get('HF_REPO')
            timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
            
            # Upload latest feature files
            feature_files = glob.glob('data/features/features_*.csv*')
            if feature_files:
              latest_feature_file = max(feature_files, key=os.path.getctime)
              filename = os.path.basename(latest_feature_file)
              hf_path = f'features/{timestamp}_{filename}'
              
              api.upload_file(
                path_or_fileobj=latest_feature_file,
                path_in_repo=hf_path,
                repo_id=repo_id,
                commit_message=f'📊 Upload features: {timestamp}'
              )
              print(f'✅ Uploaded {latest_feature_file} to Hugging Face Hub as {hf_path}')
            else:
              print('⚠️ No feature files found to upload')

            # Upload feature metadata
            metadata_path = 'data/features/feature_metadata.csv'
            if os.path.exists(metadata_path):
              api.upload_file(
                path_or_fileobj=metadata_path,
                path_in_repo=f'features/{os.path.basename(metadata_path)}',
                repo_id=repo_id,
                commit_message='✨ Upload feature metadata'
              )
              print(f'✅ Uploaded {metadata_path} to Hugging Face Hub')

            # Upload raw data files
            raw_data_files = glob.glob('data/raw/*')
            if raw_data_files:
              for raw_file in raw_data_files:
                if os.path.isfile(raw_file):
                  filename = os.path.basename(raw_file)
                  hf_path = f'data/raw/{filename}'
                  
                  api.upload_file(
                    path_or_fileobj=raw_file,
                    path_in_repo=hf_path,
                    repo_id=repo_id,
                    commit_message=f'📦 Upload raw data: {filename}'
                  )
                  print(f'✅ Uploaded {raw_file} to Hugging Face Hub')
            else:
              print('⚠️ No raw data files found to upload')
            
          except Exception as e:
            print(f'❌ Hugging Face upload failed: {str(e)}')
            exit(1)
          "
      
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > data/last_update.txt
          echo "Features uploaded to Hugging Face Hub" > data/hf_status.txt
          
          git add data/last_update.txt data/hf_status.txt
          git commit -m "📊 Update data metadata: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push origin main || echo "Push failed"

  model-training:
    runs-on: ubuntu-latest
    needs: [setup, data-fetching]
    if: needs.setup.outputs.should-train != 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install requests pandas numpy scikit-learn xgboost joblib streamlit plotly huggingface_hub
      
      - name: Set Python path
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Download latest features from Hugging Face Hub
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi, login, hf_hub_download
          
          try:
            login(token='${{ secrets.HF_TOKEN }}')
            api = HfApi()
            repo_id = os.environ.get('HF_REPO')
            
            files = api.list_repo_files(repo_id=repo_id, repo_type='model')
            feature_files = [f for f in files if f.startswith('features/') and 'features_' in f]
            
            if feature_files:
              latest_file = sorted(feature_files, reverse=True)[0]
              
              os.makedirs('data/features', exist_ok=True)
              local_path = hf_hub_download(
                repo_id=repo_id,
                filename=latest_file,
                local_dir='data',
                local_dir_use_symlinks=False
              )
              print(f'✅ Downloaded {latest_file} from Hugging Face Hub')
            else:
              print('⚠️ No feature files found in Hugging Face Hub')
              
          except Exception as e:
            print(f'❌ Hugging Face download failed: {str(e)}')
            exit(1)
          "
      
      - name: Train models
        run: python model_training/train_model.py
      
      - name: Upload Best Model and Registry to Hub
        run: python model_upload_job.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Pass the token as an environment variable
          HF_REPO: ${{ env.HF_REPO }}
      
      - name: Commit model status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add models/
          git add explainability/
          git commit -m "🤖 Update model status: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push origin main || echo "Push failed"

  inference:
    runs-on: ubuntu-latest
    needs: [setup, data-fetching, model-training]
    if: needs.setup.outputs.should-infer != 'false' && (needs.model-training.result == 'success' || needs.model-training.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install requests pandas numpy scikit-learn xgboost joblib shap streamlit plotly huggingface_hub
      
      - name: Set Python path
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Download best model from Hugging Face Hub
        run: |
          python -c "
          import os
          import pandas as pd
          from huggingface_hub import HfApi, login, hf_hub_download
          
          try:
            login(token='${{ secrets.HF_TOKEN }}')
            api = HfApi()
            repo_id = os.environ.get('HF_REPO')

            # Download the model registry first
            registry_path = hf_hub_download(
                repo_id=repo_id,
                filename='models/model_registry.csv',
                local_dir='.',
                local_dir_use_symlinks=False
            )
            print('✅ Downloaded model registry from Hugging Face Hub')

            # Read the registry to find the best model
            registry_df = pd.read_csv(registry_path)
            if not registry_df.empty:
                best_model_row = registry_df.loc[registry_df['test_overall_rmse'].idxmin()]
                best_model_filename = best_model_row['model_file']
                
                # Download the best model
                local_path = hf_hub_download(
                    repo_id=repo_id,
                    filename=f'models/{best_model_filename}',
                    local_dir='.',
                    local_dir_use_symlinks=False
                )
                
                # Copy and rename it to the expected path for the inference script
                os.makedirs('models', exist_ok=True)
                os.rename(local_path, 'models/best_model.joblib')
                print(f'✅ Downloaded and renamed best model ({best_model_filename}) from Hugging Face Hub')
            else:
                print('⚠️ Model registry is empty. Inference will proceed without a model.')

          except Exception as e:
            print(f'❌ Model download failed: {str(e)}')
            print('Inference will proceed with local models if available.')
          "
        env: # Pass the token to this step
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ env.HF_REPO }}
      
      - name: Run inference
        run: python pipelines/inference_pipeline.py
        env:
          AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      
      - name: Upload predictions and alerts to Hugging Face Hub
        run: |
          python -c "
          import os
          import glob
          from huggingface_hub import HfApi, login
          from datetime import datetime
          
          try:
            login(token='${{ secrets.HF_TOKEN }}')
            api = HfApi()
            repo_id = os.environ.get('HF_REPO')
            timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
            
            # Upload latest prediction and alerts
            prediction_path = 'predictions/latest_prediction.csv'
            alerts_path = 'predictions/aqi_alerts.csv'

            if os.path.exists(prediction_path):
              api.upload_file(
                path_or_fileobj=prediction_path,
                path_in_repo='predictions/latest_prediction.csv',
                repo_id=repo_id,
                commit_message='🔮 Upload latest predictions'
              )
              print(f'✅ Uploaded {prediction_path} to Hugging Face Hub')

            if os.path.exists(alerts_path):
              api.upload_file(
                path_or_fileobj=alerts_path,
                path_in_repo='predictions/aqi_alerts.csv',
                repo_id=repo_id,
                commit_message='🚨 Upload AQI alerts'
              )
              print(f'✅ Uploaded {alerts_path} to Hugging Face Hub')

            # Upload timestamped predictions
            prediction_files = glob.glob('predictions/*.csv') + glob.glob('predictions/*.json')
            for pred_file in prediction_files:
              if 'latest_prediction' not in pred_file and 'aqi_alerts' not in pred_file:
                filename = os.path.basename(pred_file)
                hf_path = f'predictions/{timestamp}_{filename}'
                
                api.upload_file(
                  path_or_fileobj=pred_file,
                  path_in_repo=hf_path,
                  repo_id=repo_id,
                  commit_message=f'🔮 Upload predictions: {timestamp}'
                )
                print(f'✅ Uploaded {pred_file} to Hugging Face Hub')
                
          except Exception as e:
            print(f'❌ Prediction upload failed: {str(e)}')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      
      - name: Commit predictions metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > data/predictions/last_prediction.txt
          git add data/predictions/last_prediction.txt || echo "No prediction metadata to add"
          git commit -m "🔮 Update prediction metadata: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push origin main || echo "Push failed"

  deploy-streamlit:
    runs-on: ubuntu-latest
    needs: [setup, data-fetching, model-training, inference]
    if: needs.setup.outputs.should-infer != 'false' && (needs.model-training.result == 'success' || needs.model-training.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up Git LFS
        run: |
          sudo apt-get install git-lfs
          git lfs install
          git lfs pull
      
      - name: Deploy Streamlit app to Hugging Face Spaces
        run: |
          python -c "
          import os
          import shutil
          from huggingface_hub import HfApi
          
          try:
            api = HfApi()
            space_id = os.environ.get('HF_SPACE')
            
            # The token is passed as an environment variable in the workflow step.
            # We don't need to check for the secret inside the Python script.
            
            space_repo_name = space_id.split('/')[-1]
            
            # Clone the Space repository to get a local copy
            print(f'Cloning Hugging Face Space: {space_id}')
            api.repo_info(repo_id=space_id) # check if repo exists
            
            os.system(f'git clone https://huggingface.co/spaces/{space_id}')
            os.chdir(space_repo_name)
            os.system('git config user.name \"github-actions[bot]\"')
            os.system('git config user.email \"github-actions[bot]@users.noreply.github.com\"')
            os.system('git pull')
            
            # Move back to the main repo root
            os.chdir('..')
            
            # Copy files from your main repository into the cloned Space directory
            shutil.copy('app.py', space_repo_name)
            shutil.copy('requirements.txt', space_repo_name)
            
            os.makedirs(os.path.join(space_repo_name, 'predictions'), exist_ok=True)
            os.makedirs(os.path.join(space_repo_name, 'data', 'raw'), exist_ok=True)
            
            shutil.copytree('predictions', os.path.join(space_repo_name, 'predictions'), dirs_exist_ok=True)
            shutil.copytree('data/raw', os.path.join(space_repo_name, 'data', 'raw'), dirs_exist_ok=True)
            
            # Move into the Space directory for commit and push
            os.chdir(space_repo_name)
            os.system('git add .')
            os.system('git commit -m \"🚀 Update Streamlit app via GitHub Actions\" || echo \"No changes to commit\"')
            os.system('git push')
            
            print(f'✅ Successfully deployed to Hugging Face Spaces!')
            print(f'🌐 Your app is available at: https://huggingface.co/spaces/{space_id}')
            
          except Exception as e:
            print(f'❌ Deployment to HF Spaces failed: {str(e)}')
            exit(1)
          "
        env: # This is the missing piece!
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
  notify:
    runs-on: ubuntu-latest
    needs: [data-fetching, model-training, inference, deploy-streamlit]
    if: always()
    steps:
      - run: |
          echo "## 🚀 AQI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Data Fetch: ${{ needs.data-fetching.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model Training: ${{ needs.model-training.result }}" >> $GITHUB_STEP_SUMMARY  
          echo "- Inference: ${{ needs.inference.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Streamlit Deploy: ${{ needs.deploy-streamlit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🤗 **Hugging Face Integration:**" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Models & Data: [HF Hub](${{ env.HF_REPO }})" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Live Dashboard: [HF Spaces](${{ env.HF_SPACE }})" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Only models with RMSE < 40 are saved" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Auto-updating dashboard with latest models" >> $GITHUB_STEP_SUMMARY
